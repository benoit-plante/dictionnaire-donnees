[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ddict"
version = "0.16.0"
description = "Local, AI-assisted creation of research data dictionaries (working name: dictionnaire-donnees)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benoit Plante" }]
requires-python = ">=3.11"
# Runtime dependencies are added step by step, each one recorded in docs/dependances.md.
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pypdf>=6",
    "pyreadstat>=1.3.6",
    "python-docx>=1.2.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
ddict = "ddict.cli:main"

# The icon's launcher (v0.7.1, D-055): a GUI script, so Windows opens no console window.
[project.gui-scripts]
ddict-fenetre = "ddict.window:main"

[project.optional-dependencies]
ia = [
    "httpx>=0.28.1",
]
revision = [
    "pywebview>=6.2.1; sys_platform == 'win32'",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "playwright>=1.64.0",
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "streamlit>=1.65.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ddict"]

# The model bench (v0.4, step 6) runs on the two fictional bases and their answer key.
[tool.hatch.build.targets.wheel.force-include]
"exemples/bases-fictives/corrige-banc.json" = "ddict/banc/corrige-banc.json"
"exemples/bases-fictives/etude-sommeil.csv" = "ddict/banc/etude-sommeil.csv"
# v0.16 (D-125): "Essayer avec la base fictive", on the home page.
"exemples/bases-fictives/etude-sommeil.sav" = "ddict/banc/etude-sommeil.sav"
"exemples/bases-fictives/questionnaire-sommeil.pdf" = "ddict/banc/questionnaire-sommeil.pdf"
"exemples/bases-fictives/enquete-familles.csv" = "ddict/banc/enquete-familles.csv"
"exemples/bases-fictives/questionnaire-familles.pdf" = "ddict/banc/questionnaire-familles.pdf"
"exemples/bases-fictives/sleep-study.csv" = "ddict/banc/sleep-study.csv"
"exemples/bases-fictives/questionnaire-sleep.pdf" = "ddict/banc/questionnaire-sleep.pdf"
"exemples/bases-fictives/etude-activite.csv" = "ddict/banc/etude-activite.csv"
"exemples/bases-fictives/questionnaire-activite.pdf" = "ddict/banc/questionnaire-activite.pdf"
"exemples/bases-fictives/corrige-surveymonkey.json" = "ddict/banc/corrige-surveymonkey.json"
"exemples/bases-fictives/travail-t2_surveymonkey.sav" = "ddict/banc/travail-t2_surveymonkey.sav"
"exemples/bases-fictives/travail-t2_surveymonkey.xlsx" = "ddict/banc/travail-t2_surveymonkey.xlsx"

[tool.pytest.ini_options]
# Network access is forbidden in every test (CONCEPTION.md, principle 5).
addopts = ["--disable-socket", "--strict-markers"]
markers = [
    # D-046: real exports outside the repository, given by DDICT_DONNEES_REELLES; skipped
    # without it, so never run by continuous integration. Counts only, never a value.
    "reel: tests on real survey exports kept outside the repository (D-046)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
# French typography in interface strings: en dash for ranges, non-breaking spaces.
# French text: en dash, non-breaking spaces, typographic apostrophe.
# Statistics (v0.9): the minus sign and rho; the alpha level (v0.13).
allowed-confusables = ["–", " ", " ", "’", "−", "ρ", "α"]

[tool.ruff.format]
line-ending = "lf"
