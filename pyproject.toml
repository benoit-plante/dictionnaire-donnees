[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ddict"
version = "0.3.0"
description = "Local, AI-assisted creation of research data dictionaries (working name: dictionnaire-donnees)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benoit Plante" }]
requires-python = ">=3.11"
# Runtime dependencies are added step by step, each one recorded in docs/dependances.md.
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pypdf>=6",
    "pyreadstat>=1.3.6",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
ddict = "ddict.cli:main"

[project.optional-dependencies]
ia = [
    "httpx>=0.28.1",
]
revision = [
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "streamlit>=1.65.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ddict"]

[tool.pytest.ini_options]
# Network access is forbidden in every test (CONCEPTION.md, principle 5).
addopts = ["--disable-socket", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
# French typography in interface strings: en dash for ranges, non-breaking spaces.
# French text: en dash, non-breaking spaces, typographic apostrophe.
allowed-confusables = ["–", " ", " ", "’"]

[tool.ruff.format]
line-ending = "lf"
